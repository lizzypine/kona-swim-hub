name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DOTENV_DISABLED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SECRET_KEY: ci-only-dummy-key
  DEBUG: "False"
  EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
  EMAIL_HOST: ""
  EMAIL_HOST_PASSWORD: ""
  TURNSTILE_SITEKEY: 1x00000000000000000000AA
  TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
  RESEND_API_KEY: ""
  RESEND_WEBHOOK_SECRET: ""
  EMAIL_FORWARD_TO: ""

jobs:
  tests:
    name: Django tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_url: "sqlite:///:memory:"
          - database: postgresql
            database_url: postgres://kona:ci-only-password@127.0.0.1:5432/kona_ci
    services:
      postgres:
        image: ${{ matrix.database == 'postgresql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: kona
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kona_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kona -d kona_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database_url }}
      STATIC_ROOT: /tmp/kona-static
    steps:
      - name: Check out pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install and check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check Django and migration consistency
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Apply migrations to the disposable CI database
        run: python manage.py migrate --noinput
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run the complete test suite
        run: python manage.py test --noinput

  container:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Lightsail image
        run: docker build --platform linux/amd64 --tag kona-swim-hub:ci .
      - name: Check container dependencies, health, and static assets
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            --env PYTHON_DOTENV_DISABLED=1 \
            --env SECRET_KEY=ci-container-dummy-key \
            --env DATABASE_URL=sqlite:///:memory: \
            --env DEBUG=False \
            --env EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend \
            kona-swim-hub:ci python scripts/ci_container_smoke.py

  required:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [tests, container]
    if: ${{ always() }}
    env:
      TEST_RESULT: ${{ needs.tests.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
    steps:
      - name: Require every test and container job to succeed
        run: |
          test "$TEST_RESULT" = success
          test "$CONTAINER_RESULT" = success
