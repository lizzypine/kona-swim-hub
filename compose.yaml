services:
  web:
    build:
      context: .
    image: kona-swim-hub:local
    platform: linux/amd64
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - local-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz/', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  local-data:
